name: OAuth Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: oauth-karasu256-com
          secret-names: OAUTH_PROXY_SECRET
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_ENV: dev
    steps:
      - uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: dev-oauth-karasu256-com
          secret-names: OAUTH_PROXY_SECRET
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
